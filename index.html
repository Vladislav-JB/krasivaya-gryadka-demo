<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Красивая Грядка Опт</title>
<meta name="description" content="Демо B2B-портала оптовых продаж: каталог, личный кабинет, накопительные скидки, импорт прайса, админка.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F2F4EE;--surface:#FFFFFF;--surface2:#E9EDE3;--ink:#18211A;--muted:#5A675C;--line:#D5DCCF;
  --primary:#2E5B3B;--primary-hover:#244A30;--primary-ink:#FFFFFF;--primary-soft:#DDE8DA;
  --accent:#A8660F;--accent-soft:#F5E6CB;
  --good:#2F7A45;--good-soft:#DCEEDF;--warn:#8F620A;--warn-soft:#F6EACB;--bad:#B3372B;--bad-soft:#F6DEDA;--info:#2F5E8A;--info-soft:#DCE7F2;
  --leaf:#3F7A4C;--leaf2:#6FA05A;--bloom:#C9577A;--soil:#7A5A3C;--pot:#B9A58A;
  --shadow:0 1px 2px rgba(24,33,26,.06),0 8px 24px rgba(24,33,26,.08);
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Unbounded","Onest",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0F1411;--surface:#161D18;--surface2:#1E2720;--ink:#E3E9E1;--muted:#9AA79C;--line:#2B362E;
  --primary:#86BD93;--primary-hover:#9DCCA8;--primary-ink:#0D1A11;--primary-soft:#22362A;
  --accent:#E3A64B;--accent-soft:#3A2D16;
  --good:#72C488;--good-soft:#1C3324;--warn:#E4B456;--warn-soft:#3A2F16;--bad:#F08276;--bad-soft:#3D1F1B;--info:#86B6E2;--info-soft:#1B2B3B;
  --leaf:#6FAE7B;--leaf2:#9CC77F;--bloom:#E487A4;--soil:#A88463;--pot:#6E6453;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1411;--surface:#161D18;--surface2:#1E2720;--ink:#E3E9E1;--muted:#9AA79C;--line:#2B362E;
  --primary:#86BD93;--primary-hover:#9DCCA8;--primary-ink:#0D1A11;--primary-soft:#22362A;
  --accent:#E3A64B;--accent-soft:#3A2D16;
  --good:#72C488;--good-soft:#1C3324;--warn:#E4B456;--warn-soft:#3A2F16;--bad:#F08276;--bad-soft:#3D1F1B;--info:#86B6E2;--info-soft:#1B2B3B;
  --leaf:#6FAE7B;--leaf2:#9CC77F;--bloom:#E487A4;--soil:#A88463;--pot:#6E6453;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.45rem;line-height:1.25}
h2{font-size:1.08rem;line-height:1.3}
h3{font-size:.95rem;font-family:var(--f-body);font-weight:600;letter-spacing:0}
p{margin:0}
a{color:var(--primary)}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Demo strip + top bar */
.demo-strip{background:var(--accent-soft);color:var(--ink);font-size:.8rem;padding:6px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo-strip b{color:var(--accent)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);display:grid;place-items:center}
.brand-name{font-family:var(--f-disp);font-weight:600;font-size:.95rem;line-height:1.1;text-align:left}
.brand-name small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.top-search{flex:1 1 260px;max-width:460px;position:relative}
.top-search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.top-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:.82rem;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cart-btn{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.cart-btn .badge{background:var(--accent);color:#fff;border-radius:99px;font-size:.72rem;padding:0 7px;line-height:18px;font-weight:600}

/* Layout */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;padding-inline:16px;padding-block:20px 60px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:0 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:500;font-size:.92rem}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav .cnt{margin-left:auto;font-size:.72rem;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px;font-size:.92rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;font-size:.85rem}
.field label{font-weight:500;color:var(--muted)}
.input,select.input,textarea.input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
textarea.input{min-height:110px;font-family:var(--f-mono);font-size:.85rem}
.input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--primary);width:16px;height:16px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.84rem;cursor:pointer;font-weight:500}
.tag[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tag .x{opacity:.7}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
td .input{padding:5px 8px;min-width:80px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-disp);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:.82rem;color:var(--muted)}

/* Discount hero */
.level{background:var(--primary);color:var(--primary-ink);border-radius:14px;padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
.level .big{font-family:var(--f-disp);font-size:3.6rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.level .big small{font-size:1.4rem}
.level .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.ladder{display:flex;flex-direction:column;gap:10px}
.ladder-track{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.2)}
:root[data-theme="dark"] .ladder-track{background:rgba(0,0,0,.2)}
.ladder-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.ladder-ticks{position:relative;height:34px;font-size:.76rem}
.ladder-ticks span{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.25}
.ladder-ticks span b{display:block;font-size:.85rem}
.ladder-ticks span.first{transform:none}
.ladder-ticks span.last{transform:translateX(-100%);text-align:right}
.level-note{font-size:.9rem}
.level-note b{font-weight:700}

/* Catalog */
.filters{display:flex;flex-direction:column;gap:12px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.card:hover{box-shadow:var(--shadow)}
.thumb{background:var(--surface2);aspect-ratio:4/3;display:grid;place-items:center;cursor:pointer;border:0;padding:0;width:100%;max-width:100%}
.thumb svg{width:62%;height:auto}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-name{font-weight:600;line-height:1.3;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.card-name:hover{color:var(--primary)}
.chars{font-size:.8rem;color:var(--muted)}
.price-row{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price{font-family:var(--f-disp);font-weight:500;font-size:1.1rem;font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through;font-size:.84rem;font-variant-numeric:tabular-nums}
.buy{display:flex;gap:8px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:30px;height:34px;cursor:pointer;font-size:1rem}
.qty input{width:52px;border:0;text-align:center;height:34px;background:var(--surface);font-variant-numeric:tabular-nums}
.buy .btn{flex:1}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,16,12,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:14px;max-width:880px;width:100%;max-height:calc(100% - 20px);overflow:auto;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-body{padding:20px}
.x-btn{border:0;background:var(--surface2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.gal-main{background:var(--surface2);border-radius:var(--r);aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.gal-main svg{width:64%}
.gal-th{display:flex;gap:8px;margin-top:8px}
.gal-th button{flex:1;aspect-ratio:1;background:var(--surface2);border:2px solid transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center;padding:4px}
.gal-th button[aria-pressed="true"]{border-color:var(--primary)}
.gal-th svg{width:70%}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.9rem}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0;font-weight:500}

/* Documents */
.doc{background:#fff;color:#1a1a1a;border:1px solid #d8d8d8;padding:28px;font-size:.84rem;font-family:var(--f-body)}
.doc h2{font-family:var(--f-body);font-weight:700;font-size:1.1rem;margin:14px 0}
.doc table th{background:#f0f0f0;color:#333}
.doc td,.doc th{border:1px solid #bbb;padding:5px 8px}
.doc .req{display:grid;grid-template-columns:140px 1fr;gap:2px 10px}

/* Charts */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.hbar .trk{height:16px;position:relative}
.hbar .fill{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:0 4px 4px 0}
.hbar .val{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;min-width:90px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--primary)}
.chart .bar.dim{fill:var(--primary);opacity:.45}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar, .chart g:hover .bar{opacity:1;fill:var(--accent)}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}

/* Import */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--bg)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.sumrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sum{border-radius:8px;padding:10px 12px;background:var(--surface2)}
.sum .v{font-family:var(--f-disp);font-size:1.2rem;font-variant-numeric:tabular-nums}
.sum.good{background:var(--good-soft)} .sum.bad{background:var(--bad-soft)} .sum.warn{background:var(--warn-soft)} .sum.info{background:var(--info-soft)}
.opt-group{display:flex;gap:8px;flex-wrap:wrap}
.radio{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.88rem;background:var(--surface)}
.radio:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.radio input{accent-color:var(--primary)}

/* Integrations */
.integ{display:flex;flex-direction:column;gap:10px}
.integ-top{display:flex;align-items:center;gap:12px}
.integ-ic{width:40px;height:40px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:.8rem;color:var(--primary)}
.feed{display:flex;flex-direction:column}
.feed div{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.85rem}
.feed div:first-child{border-top:0}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}

.note{background:var(--info-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.86rem}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.good{background:var(--good-soft)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:70;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.login{max-width:420px;margin:30px auto;width:100%}
.hr{height:1px;background:var(--line)}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}.sumrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:14px}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .eyebrow{display:none}
  .nav button{white-space:nowrap;flex:none}
  .side-card{display:none}
  .grid2,.pd{grid-template-columns:1fr}
  .level{grid-template-columns:1fr;gap:14px}
}
@media (max-width:520px){
  .kpis,.grid3{grid-template-columns:1fr 1fr;gap:10px}
  .sumrow{grid-template-columns:1fr 1fr}
  .level .big{font-size:2.8rem}
  .hbar{grid-template-columns:1fr auto}.hbar .trk{grid-column:1 / -1;order:3}
  .top-search{order:5;flex-basis:100%;max-width:none}
  .brand-name small{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.tag,.nav button{transition:background .15s,border-color .15s,color .15s}.ladder-fill{transition:width .6s ease}}
</style>

<div class="demo-strip"><span><b>Демо-версия.</b> Все данные тестовые. Обмен с 1С, проверка ИНН, почта и Telegram имитируются.</span><span class="row" style="gap:8px"><button class="btn sm ghost" data-act="reset">Сбросить демо-данные</button></span></div>

function periodStart(){const d=new Date(NOW);d.setMonth(d.getMonth()-S.rules.period);return d}
function counted(l){return !(S.rules.excludeSeasonal&&l.seasonal)&&!S.rules.excludedCats.includes(l.cat)}
function turnover(cid){
  const from=periodStart();let t=0,ex=0;
  S.orders.forEach(o=>{if(o.client!==cid||o.status!=='Закрыт'||new Date(o.date)<from)return;
    o.lines.forEach(l=>{const v=l.qty*l.price*(1-(o.disc||0)/100);if(counted(l))t+=v;else ex+=v})});
  return{t,ex};
}
function levelFor(t){const L=[...S.rules.levels].sort((a,b)=>a.from-b.from);let cur={from:0,pct:0},next=null;for(const l of L){if(t>=l.from)cur=l;else{next=l;break}}return{cur,next,L}}
function disc(cid){const c=client(cid);const {t,ex}=turnover(cid);const {cur,next,L}=levelFor(t);
  const eff=c.personal!=null?c.personal:cur.pct;return{t,ex,cur,next,L,eff,personal:c.personal,toNext:next?next.from-t:0}}
const myPrice=(p,cid=S.me)=>Math.round(p.price*(1-disc(cid).eff/100));

function monthly(cid){

  return arr;

function monthChart(cid){
  const data=monthly(cid);const W=640,H=230,pl=52,pr=8,pt=14,pb=26;const max=Math.max(...data.map(d=>d.v),1);
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[.1,.2,.25,.5,1,2,2.5,5,10].map(k=>k*step).find(v=>v*4>=max)||step*10;const top=nice*4;
  const x0=i=>pl+i*(W-pl-pr)/12;const bw=(W-pl-pr)/12-6;const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';for(let k=0;k<=4;k++){const v=nice*k;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v>=1e6?(v/1e6).toLocaleString('ru-RU')+' млн':v>=1e3?(v/1e3)+' тыс':v}</text>`}
  const imax=data.reduce((b,d,i)=>d.v>data[b].v?i:b,0);
  data.forEach((d,i)=>{const x=x0(i)+3,h=Math.max(0,H-pb-y(d.v));const r=Math.min(4,h);
    const p=h>0?`M${x},${H-pb}V${y(d.v)+r}Q${x},${y(d.v)} ${x+r},${y(d.v)}H${x+bw-r}Q${x+bw},${y(d.v)} ${x+bw},${y(d.v)+r}V${H-pb}Z`:'';
    g+=`<g data-tip="${MONTHS[d.m]} ${d.y}: ${rub(d.v)}${d.s?` (сезонные ${rub(d.s)})`:''}"><rect class="hit" x="${x0(i)}" y="${pt}" width="${bw+6}" height="${H-pt-pb}"/>${p?`<path class="bar${i===imax||i===11?'':' dim'}" d="${p}"/>`:''}</g><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${MONTHS[d.m]}</text>`;
    if(i===imax&&d.v>0)g+=`<text x="${x+bw/2}" y="${y(d.v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${(d.v/1e3).toFixed(0)} тыс</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Закупки по месяцам">${g}</svg></div>`;
}

VIEWS.quick=()=>`<div class="page-head"><div><h1>Быстрый заказ</h1><p class="sub">Загрузите файл Excel или CSV с двумя колонками: артикул и количество. Или вставьте список ниже.</p></div></div>
  <div class="grid2">
   <div class="panel stack"><h2>Из файла</h2>
    <div class="drop" id="qDrop"><b>Перетащите .xlsx или .csv сюда</b><span class="muted small">Первая колонка: артикул, вторая: количество. Строка заголовков допускается.</span><label class="btn"><input type="file" id="qFile" accept=".xlsx,.xls,.csv,.txt" hidden>Выбрать файл</label></div>
    <button class="btn ghost sm" data-act="qtpl">Скачать шаблон для быстрого заказа (.xlsx)</button>
   </div>
   <div class="panel stack"><h2>Списком</h2>
    <div class="field"><label for="qText">Артикул и количество через «;», табуляцию или пробел, по одной позиции в строке</label><textarea class="input" id="qText">${esc(S.qText??'KG-CN-001;40\nKG-SH-001;25\nKG-PR-002 100\nKG-RS-003\t30\nKG-XX-999;5\nKG-GR-001;0')}</textarea></div>
    <button class="btn primary" data-act="qparse">Проверить список</button>
   </div>
  </div>
  <div id="qResult">${S.qRes?qResult(S.qRes):''}</div>`;
function parseQuick(rows){
  const res=[];const seen={};
  rows.forEach((r,i)=>{let [a,q]=r;a=String(a??'').trim().toUpperCase();if(!a)return;if(i===0&&/артикул|article|sku/i.test(a))return;
    const qty=Number(String(q??'').replace(',','.').trim());const p=prod(a);
    let st='ok',msg='';
    if(!p){st='bad';msg='Артикул не найден'}else if(p.status==='archive'){st='bad';msg='Позиция в архиве'}
    else if(!q&&q!==0||isNaN(qty)){st='bad';msg='Не указано количество'}else if(qty<=0){st='bad';msg='Количество должно быть больше 0'}
    else if(seen[a]!=null){st='warn';msg='Повтор артикула, количества сложены';res[seen[a]].qty+=qty;return}
    else if(p.stock<qty){st='warn';msg=p.stock?`В наличии ${p.stock}, остальное под заказ`:'Под заказ: '+leadTxt(p).toLowerCase()}
    if(p&&st!=='bad')seen[a]=res.length;
    res.push({line:i+1,art:a,qty:isNaN(qty)?'—':qty,p,st,msg});
  });
  return res;
}
function qResult(res){
  const ok=res.filter(r=>r.st!=='bad');const sum=ok.reduce((s,r)=>s+myPrice(r.p)*r.qty,0);
  return `<section class="panel"><div class="panel-head"><h2>Результат проверки</h2><div class="row"><span class="pill good">Найдено ${ok.length}</span>${res.length-ok.length?`<span class="pill bad">Ошибок ${res.length-ok.length}</span>`:''}</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Строка</th><th>Артикул</th><th>Товар</th><th class="r">Кол-во</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>
  ${res.map(r=>`<tr><td class="num">${r.line}</td><td class="mono">${esc(r.art)}</td><td>${r.p?esc(r.p.name):'<span class="muted">—</span>'}</td><td class="r num">${r.qty}</td><td class="r num">${r.st!=='bad'?rub(myPrice(r.p)*r.qty):'—'}</td><td>${r.st==='ok'?'<span class="pill good">OK</span>':`<span class="pill ${r.st}">${r.msg}</span>`}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><span class="muted">Будет добавлено на</span><span class="price">${rub(sum)}</span><button class="btn primary" data-act="qadd"${ok.length?'':' disabled'}>Добавить ${ok.length} ${plural(ok.length,'позицию','позиции','позиций')} в корзину</button></div></section>`;
}
AFTER.quick=()=>{
  const f=$('#qFile');f.onchange=()=>f.files[0]&&readQuickFile(f.files[0]);
  const d=$('#qDrop');['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',e=>{const file=e.dataTransfer.files[0];if(file)readQuickFile(file)});
};
function readRows(file,cb){
  const rd=new FileReader();
  if(/\.(csv|txt)$/i.test(file.name)){rd.onload=()=>cb(String(rd.result).split(/\r?\n/).map(l=>l.split(/[;,\t]/)));rd.readAsText(file,'utf-8')}
  else{rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}))}catch(e){toast('Не удалось прочитать файл. Сохраните его как .xlsx или .csv и загрузите снова.')}};rd.readAsArrayBuffer(file)}
}
function readQuickFile(file){readRows(file,rows=>{S.qRes=parseQuick(rows);$('#qResult').innerHTML=qResult(S.qRes);toast(`Файл «${file.name}» обработан`)})}

 d.addEventListener('drop',e=>{const file=e.dataTransfer.files[0];if(file)readRows(file,rows=>{S.preview=analyze(rows,file.name,'Вручную');render()})});

function analyze(rows,file,src){
 const mode=S.imp.mode;const head=(rows[0]||[]).map(h=>String(h).trim().toLowerCase());const idx={};
 COLS.forEach(c=>idx[c]=head.indexOf(c.toLowerCase()));
 const missCols=COLS.filter(c=>idx[c]<0&&(c==='Артикул'||mode==='full'&&['Наименование','Цена','Остаток'].includes(c)||mode==='price'&&c==='Цена'||mode==='stock'&&c==='Остаток'||mode==='cat'&&c==='Категория'));
 if(missCols.length)return{file,src,mode,fatal:`В файле нет обязательных колонок: ${missCols.join(', ')}. Скачайте шаблон и проверьте заголовки в первой строке.`,rows:rows.length-1,errors:[],ops:[]};
 const errors=[],ops=[],seen=new Set();let upd=0,cre=0;
 const g=(r,c)=>idx[c]>=0?r[idx[c]]:undefined;
 for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.every(x=>String(x).trim()===''))continue;const n=i+1;
  const art=String(g(r,'Артикул')??'').trim().toUpperCase();
  if(!art){errors.push({row:n,msg:'Не заполнен артикул'});continue}
  if(seen.has(art)){errors.push({row:n,msg:`Дубль артикула ${art}`});continue}seen.add(art);
  const ex=prod(art);const priceRaw=g(r,'Цена'),stockRaw=g(r,'Остаток');
  const price=Number(String(priceRaw??'').replace(/\s/g,'').replace(',','.'));const stock=Number(String(stockRaw??'').replace(/\s/g,''));
  if((mode==='full'||mode==='price')&&(String(priceRaw??'').trim()===''||isNaN(price)||price<=0)){errors.push({row:n,msg:String(priceRaw??'').trim()===''?`Не заполнена цена (${art})`:`Цена не число: «${priceRaw}» (${art})`});continue}
  if((mode==='full'||mode==='stock')&&(String(stockRaw??'').trim()===''||isNaN(stock)||stock<0||!Number.isInteger(stock))){errors.push({row:n,msg:`Остаток не целое число: «${stockRaw}» (${art})`});continue}
  if(mode==='cat'&&!String(g(r,'Категория')??'').trim()){errors.push({row:n,msg:`Не заполнена категория (${art})`});continue}
  if(!ex){if(mode!=='full'){errors.push({row:n,msg:`Артикул ${art} не найден. Новые позиции создаются только при полной загрузке`});continue}
   const name=String(g(r,'Наименование')??'').trim();if(!name){errors.push({row:n,msg:`Новая позиция ${art} без наименования`});continue}cre++}else upd++;
  ops.push({art,exists:!!ex,name:String(g(r,'Наименование')??'').trim(),cat:String(g(r,'Категория')??'').trim(),price,stock,unit:String(g(r,'Единица измерения')??'шт').trim()||'шт',seasonal:/^(да|yes|1|сезон)/i.test(String(g(r,'Сезонность')??''))});
 }
 const arch=mode==='full'?S.products.filter(p=>p.status!=='archive'&&!seen.has(p.art)).map(p=>p.art):[];
 return{file,src,mode,rows:rows.length-1,errors,ops,upd,cre,arch};
}

 ${pv.arch.length?`<div class="small muted">Нет в файле: ${pv.arch.slice(0,6).map(a=>`<span class="mono">${a}</span>`).join(', ')}${pv.arch.length>6?' и ещё '+(pv.arch.length-6):''}</div>`:''}
 ${pv.errors.length?`<div class="tbl-wrap"><table><thead><tr><th>Строка</th><th>Ошибка</th></tr></thead><tbody>${pv.errors.slice(0,30).map(e=>`<tr><td class="num">${e.row}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody></table></div>${pv.errors.length>30?`<span class="muted small">Показаны первые 30 из ${pv.errors.length}</span>`:''}`:'<div class="note good">Ошибок не найдено.</div>'}
 </section>`;
}
function applyImport(){

  else if(S.clients.some(c=>c.inn===v))r.res=`<div class="note warn">Компания с этим ИНН уже работает с нами. Обратитесь к своему менеджеру за доступом.</div>`;
  else if(S.egrul[v]){const e=S.egrul[v];r.name=e.name;r.eg=e;r.res=`<div class="note good"><b>Найдено в ЕГРЮЛ:</b> ${esc(e.name)} · ${e.status}<br>КПП ${e.kpp} · ОГРН ${e.ogrn}<br>${esc(e.addr)}<br>${esc(e.head)}</div>`}
  else{r.eg=null;r.res=`<div class="note warn">ИНН корректный, но в демо-справочнике его нет. Заполните название вручную, менеджер проверит данные.</div>`}
  r.contact=$('#rgContact').value;r.phone=$('#rgPhone').value;r.email=$('#rgEmail').value;r.comment=$('#rgComment').value;render()},
 regsubmit:()=>{const r=S.reg||{};const inn=$('#rgInn').value.trim();const name=$('#rgName').value.trim();const contact=$('#rgContact').value.trim();const email=$('#rgEmail').value.trim();const phone=$('#rgPhone').value.trim();
  if(!innOk(inn)){toast('Проверьте ИНН: нажмите «Проверить» и исправьте ошибку');return}
  if(!name||!contact||!/.+@.+\..+/.test(email)){toast('Заполните название, контактное лицо и email');return}
  const e=S.egrul[inn]||{name,kpp:'—',ogrn:'—',addr:'—',head:'—',status:'Нет в справочнике'};
  const id='R-'+(59+S.requests.length);S.requests.push({id,date:new Date().toISOString(),inn,...e,name,contact,phone,email,comment:$('#rgComment').value,state:'new'});
  MANAGERS.forEach(m=>{if(S.notifyCh.tg)notify('Telegram',m.name,`Новая заявка на регистрацию: ${name}`)});if(S.notifyCh.email)notify('Email','Отдел продаж',`Новая заявка на регистрацию: ${name}`);
  addLog('Регистрация',`Заявка ${id}: ${name}, ИНН ${inn}`,contact);S.reg=null;render();
  modal('Заявка отправлена',`<div class="stack"><p>Спасибо! Заявка <b>${id}</b> от компании «${esc(name)}» передана менеджерам. После проверки вы получите письмо с логином и паролем на <b>${esc(email)}</b>.</p><div class="note">Чтобы посмотреть, как это выглядит у менеджера, переключитесь в режим «Сотрудник».</div><button class="btn primary" data-act="role" data-role="admin" style="align-self:flex-start">Открыть админ-панель</button></div>`)},
 reqok:d=>{const r=S.requests.find(x=>x.id===d.id);const m=$('#rm-'+d.id).value;const id='C-'+(1046+S.clients.length-5);const login=r.email.split('@')[0].replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,12)||'client'+id.slice(2);
  S.clients.push({id,login,name:r.name,inn:r.inn,kpp:r.kpp,city:(r.addr.match(/г\. ([^,]+)/)||[,'—'])[1],addr:r.addr,contact:r.contact,phone:r.phone,email:r.email,mgr:m,personal:null,limit:300000,deferral:14,debt:0,overdue:0,overdueDays:0,since:new Date().toISOString()});
  S.lastLevels[id]=0;r.state='ok';r.login=login;addLog('Регистрация',`Заявка ${r.id} подтверждена. Клиент ${id}, ответственный ${mgr(m).name}`);notify('Email',r.email,'Доступ в оптовый кабинет: логин '+login);render();
  modal('Клиент создан',`<div class="stack"><div class="note good">Клиент <b>${esc(r.name)}</b> получил ID <span class="mono">${id}</span>. Ответственный менеджер: ${mgr(m).name}.</div><h3>Письмо клиенту</h3><div class="doc" style="font-size:.9rem"><p><b>Кому:</b> ${esc(r.email)}<br><b>Тема:</b> Доступ в оптовый кабинет «Красивая Грядка»</p><br><p>Здравствуйте, ${esc(r.contact)}!</p><br><p>Ваша компания подключена к оптовому порталу.<br>Логин: <b>${login}</b><br>Временный пароль: <b>${Math.random().toString(36).slice(2,10)}</b><br>Личный кабинет: https://[домен-заказчика]/lk</p><br><p>Ваш менеджер: ${mgr(m).name}, ${mgr(m).phone}, ${mgr(m).email}</p></div><div class="small muted">В демо письмо не отправляется. В рабочей версии уходит через почтовый сервис сайта.</div></div>`)},
 reqno:d=>{const r=S.requests.find(x=>x.id===d.id);r.state='no';addLog('Регистрация',`Заявка ${r.id} (${r.name}) отклонена`);render()},
 cedit:d=>clientModal(d.id),
 csave:d=>{const c=client(d.id);const pv=$('#cePers').value.trim();const old=JSON.stringify([c.personal,c.limit,c.deferral,c.mgr]);c.personal=pv===''?null:Math.max(0,+pv);c.limit=+$('#ceLimit').value||0;c.deferral=+$('#ceDef').value||0;c.mgr=$('#ceMgr').value;
  addLog('Клиенты',`${c.name}: условия изменены (скидка ${c.personal==null?'накопительная':c.personal+'%'}, лимит ${rub(c.limit)}, отсрочка ${c.deferral} дн., менеджер ${mgr(c.mgr).name})`);closeModal();render();toast('Условия сохранены')},
 ofilter:d=>{S.orderFilter=d.s;render()},
 export:()=>writeXlsx([COLS,...S.products.map(p=>[p.art,p.name,p.cat,p.price,p.stock,p.unit,p.seasonal?'Да':'Нет'])],'price_export.xlsx',[14,48,24,10,10,12,10]),
 tpl:()=>writeXlsx([COLS,['KG-CN-001','Туя западная «Смарагд»','Хвойные',1450,320,'шт','Нет'],['KG-BL-001','Тюльпан «Апельдорн», сетка 50 шт','Луковичные',1650,120,'уп','Да']],'shablon_praisa.xlsx',[14,48,24,10,10,18,12]),
 apmore:()=>{S.aprodPage++;render()},
 bulkprice:()=>{const k=1+(+$('#bulkPct').value||0)/100;const sel=Object.keys(S.prodSel).filter(a=>S.prodSel[a]);sel.forEach(a=>{const p=prod(a);p.price=Math.round(p.price*k)});addLog('Товары',`Массовое изменение цены на ${$('#bulkPct').value}% для ${sel.length} позиций`);S.prodSel={};render();toast(`Цены изменены у ${sel.length} позиций`)},
 bulkst:()=>{const st=$('#bulkSt').value;const sel=Object.keys(S.prodSel).filter(a=>S.prodSel[a]);sel.forEach(a=>{const p=prod(a);p.status=st;if(st==='order')p.stock=0});addLog('Товары',`Статус «${st==='archive'?'Архив':st==='order'?'Под заказ':'Активен'}» для ${sel.length} позиций`);S.prodSel={};render()},
 demofile:()=>{S.preview=analyze(demoRows(),'price_demo_1200.xlsx','Вручную');render();setTimeout(()=>document.querySelector('.sumrow')?.scrollIntoView({behavior:'smooth',block:'center'}),50)},
 iapply:applyImport,icancel:()=>{S.preview=null;render()},
 ierr:d=>{const h=S.imports[+d.i];modal('Ошибки загрузки · '+esc(h.file),`<div class="tbl-wrap"><table><thead><tr><th>Строка</th><th>Ошибка</th></tr></thead><tbody>${h.errors.map(e=>`<tr><td class="num">${e.row}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody></table></div>`)},
 autosave:()=>{S.auto={...S.auto,on:$('#autoOn').checked,src:$('#autoSrc').value,path:$('#autoPath').value,time:$('#autoTime').value};addLog('Прайс',`Автозагрузка: ${S.auto.on?'включена, '+S.auto.src+' '+S.auto.path+', ежедневно в '+S.auto.time:'выключена'}`);render();toast('Настройки автозагрузки сохранены')},
 autorun:()=>{const keep=S.imp;S.imp={mode:'full',missing:'zero'};S.preview=analyze(demoRows(),'ftp_price_'+new Date().toISOString().slice(0,10)+'.xlsx','FTP (авто)');S.auto.last=new Date().toISOString();applyImport();S.imp=keep},
 ladd:()=>{const L=S.rules.levels;const mx=Math.max(...L.map(l=>l.from),0);S.rules.levels.push({from:mx+1000000,pct:Math.max(...L.map(l=>l.pct),0)+2});render()},
 ldel:d=>{S.rules.levels.splice(+d.i,1);if(!S.rules.levels.length)S.rules.levels.push({from:500000,pct:5});render()},
 rcat:d=>{const R=S.rules;R.excludedCats=R.excludedCats.includes(d.cat)?R.excludedCats.filter(c=>c!==d.cat):[...R.excludedCats,d.cat];render()},
 rsave:()=>{const R=S.rules;addLog('Скидки',`Правила сохранены: ${[...R.levels].sort((a,b)=>a.from-b.from).map(l=>l.pct+'% от '+fmt(l.from)+' ₽').join(', ')}; период ${R.period} мес.; сезонные ${R.excludeSeasonal?'не учитываются':'учитываются'}`);recalcAll('Пересчёт после изменения правил');render();toast('Правила сохранены, скидки пересчитаны')},
 recalc:()=>{const ch=recalcAll('Ручной пересчёт');render();toast(ch.length?`Изменилось уровней: ${ch.length}`:'Изменений нет')},
 repx:()=>{const rows=[['Клиент','Менеджер','Оборот 12 мес.','Скидка %','Долг','Просрочено']];S.clients.forEach(c=>{const d=disc(c.id);rows.push([c.name,mgr(c.mgr).name,Math.round(d.t),d.eff,c.debt,c.overdue])});writeXlsx(rows,'otchet_prodazhi.xlsx',[36,20,16,10,12,12])},
 x1c:()=>{const q=S.orders.filter(o=>o.status==='Новый'||o.status==='Запрос счёта');q.forEach(o=>{o.status='Подтверждён'});const st=S.products.filter(p=>p.status!=='archive').length;S.exchange.last=new Date().toISOString();S.exchange.next=60;
  addLog('1С',`Обмен с 1С: выгружено заказов ${q.length}, загружено остатков ${st}, цен ${st}, статусов ${q.length}`,'Система');render();toast(`Обмен завершён: ${q.length} заказов ушло в 1С`)},
 crmsync:()=>{S.crm.last=new Date().toISOString();addLog('CRM',`Синхронизация с Битрикс24: клиентов ${S.clients.length}, менеджеров ${MANAGERS.length}, заказов за сутки ${S.orders.filter(o=>NOW-new Date(o.date)<DAY*1.5).length}`,'Система');render();toast('Синхронизация с CRM выполнена')},
 logf:d=>{S.logF=d.t;render()}
};
function checkout(type){
 const items=cartItems();if(!items.length)return;const c=client(S.me);const comment=$('#ocomment')?.value||'';const d=disc(S.me);
 const id='З-'+(2400+S.orders.length);
 const o={id,client:S.me,date:new Date().toISOString(),status:type==='invoice'?'Запрос счёта':'Новый',comment,type,paid:false,disc:d.eff,lines:items.map(({p,q})=>({art:p.art,name:p.name,cat:p.cat,seasonal:p.seasonal,unit:p.unit,qty:q,price:p.price}))};
 S.orders.push(o);S.cart={};S.draftComment='';
 const sum=orderSum(o);const over=sum>c.limit-c.debt-openAmount(S.me)+sum;
 notifyMgr(c.mgr,`${type==='invoice'?'Запрос счёта':'Новый заказ'} ${id} от ${c.name} на ${rub(sum)}${over?' (превышен лимит, нужно согласование)':''}`);
 addLog('Заказы',`${type==='invoice'?'Запрос счёта':'Новый заказ'} ${id} на ${rub(sum)}`);
 render();
 modal(type==='invoice'?'Запрос счёта отправлен':'Заказ оформлен',`<div class="stack"><p>${type==='invoice'?'Запрос счёта':'Заказ'} <b class="mono">${id}</b> на <b>${rub(sum)}</b> передан менеджеру ${mgr(c.mgr).name}. Он получил уведомление на почту и в Telegram.</p><p class="muted">Заказ уйдёт в 1С при ближайшем обмене. Статус можно отслеживать в разделе «Заказы и документы».</p><div class="row"><button class="btn primary" data-act="go" data-view="orders">К заказам</button><button class="btn" data-act="doc" data-id="${id}" data-doc="Счёт">Посмотреть счёт</button></div></div>`);
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(!a)return;if(el.tagName==='A')e.preventDefault();if(el.closest('#modal')&&el.dataset.act==='go')closeModal();a(el.dataset,el,e)});
document.addEventListener('change',e=>{const el=e.target;const d=el.dataset||{};
 switch(d.ch){
  case 'cartq':{const q=Math.max(0,Math.floor(+el.value||0));if(q)S.cart[d.art]=q;else delete S.cart[d.art];S.draftComment=$('#ocomment')?.value;render();return}
  case 'ostatus':{const o=S.orders.find(x=>x.id===d.id);const old=o.status;o.status=el.value;const c=client(o.client);addLog('Заказы',`Заказ ${o.id} (${c.name}): «${old}» → «${o.status}»`);
    if(o.status==='Закрыт'&&S.rules.recalc!=='night'){const before=S.lastLevels[c.id];const ch=recalcAll(`Пересчёт при закрытии заказа ${o.id}`);const now=disc(c.id);if(before!==now.cur.pct)toast(`${c.name}: накопительная скидка ${before}% → ${now.cur.pct}%`);else toast(`Заказ ${o.id} закрыт, скидка клиента пересчитана: ${now.cur.pct}%`)}
    else toast(`Статус заказа ${o.id}: ${o.status}. Изменение уйдёт в 1С`);render();return}
  case 'psel':S.prodSel[d.art]=el.checked;render();return;
  case 'pprice':{const p=prod(d.art);const v=Math.max(0,+el.value||0);addLog('Товары',`${p.art}: цена ${p.price} → ${v}`);p.price=v;save();toast(`Цена ${p.art} сохранена`);return}
  case 'pstock':{const p=prod(d.art);const v=Math.max(0,Math.floor(+el.value||0));addLog('Товары',`${p.art}: остаток ${p.stock} → ${v}`);p.stock=v;if(p.status!=='archive')p.status=v>0?'active':'order';if(v>0&&v<10)notifyMgr('M-02',`Критический остаток: ${p.name} — ${v} ${p.unit}`);render();return}
  case 'imode':S.imp.mode=el.value;S.preview=null;render();return;
  case 'imiss':S.imp.missing=el.value;if(S.preview&&!S.preview.fatal)S.preview=S.preview;render();return;
  case 'lfrom':S.rules.levels[+d.i].from=Math.max(0,+el.value||0);render();return;
  case 'lpct':S.rules.levels[+d.i].pct=Math.max(0,+el.value||0);render();return;
 }
 if(el.id==='fAvail'){S.filters.avail=el.value;S.filters.page=1;render()}
 if(el.id==='fBrand'){S.filters.brand=el.value;S.filters.page=1;render()}
 if(el.id==='staffRole'){S.staffRole=el.value;render()}
 if(el.id==='rPeriod'){S.rules.period=+el.value;render()}
 if(el.id==='rRecalc'){S.rules.recalc=el.value;save()}
 if(el.id==='rSeas'){S.rules.excludeSeasonal=el.checked;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='ocomment')S.draftComment=e.target.value});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.filters.q=e.target.value;S.filters.page=1;if(S.view!=='catalog')S.view='catalog';render();},220)});
$('#q').value=S.filters.q||'';
render();
</script>
